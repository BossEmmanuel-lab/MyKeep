{% extends "base.html" %}
{% block title %}Sign In · MyKeep{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 apple-card p-7 animate-spring-in">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-[#0071E3] dark:bg-[#0A84FF] text-white flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M9 21V9"/></svg>
      </div>
      <h1 class="text-lg font-semibold tracking-tight">Sign in to MyKeep</h1>
    </div>
    <button type="button" onclick="toggleTheme()" class="apple-btn px-2.5 py-1 rounded-full bg-black/[0.04] dark:bg-white/[0.06] text-xs text-[#6E6E73] dark:text-[#A1A1A6]">Theme</button>
  </div>

  {% if error %}
  <div class="mb-4 p-3.5 rounded-xl bg-[#FF3B30]/10 text-[#FF3B30] dark:text-[#FF453A] text-xs font-medium">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-medium text-[#6E6E73] dark:text-[#A1A1A6] mb-1.5">Username</label>
      <input type="text" name="username" required autofocus class="apple-input w-full h-10 px-3.5 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-[#6E6E73] dark:text-[#A1A1A6] mb-1.5">Password</label>
      <input type="password" name="password" required class="apple-input w-full h-10 px-3.5 text-sm">
    </div>
    <button type="submit" class="apple-btn w-full h-10 bg-[#0071E3] dark:bg-[#0A84FF] text-white text-sm font-medium rounded-full shadow-sm hover:opacity-95">
      Sign In
    </button>
  </form>

  <div class="mt-6 pt-4 border-t border-black/[0.06] dark:border-white/[0.08] text-xs text-[#6E6E73] dark:text-[#A1A1A6] flex justify-between">
    <span>Need an account?</span>
    <a href="{% url 'register' %}" class="text-[#0071E3] dark:text-[#0A84FF] font-medium hover:underline">Create account</a>
  </div>
</div>
{% endblock %}
